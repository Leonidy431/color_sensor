# ============================================================================
# Конфигурация моделей
# ============================================================================

models:
  # U-Net для сегментации слоёв
  layer_segmentation:
    architecture: "unet"
    encoder: "mobilenetv3_small"
    input_size: [512, 256]
    output_classes: 6  # water, mud, sand, clay, gravel, rock
    weights: "layer_segmentation.hef"
    training_dataset: "sbp_layers_v2"
    training_samples: 15000
    validation_accuracy: 0.87

  # YOLOv8 для детекции объектов
  object_detector:
    architecture: "yolov8n"
    input_size: [640, 640]
    output_classes: 14
    confidence_threshold: 0.35
    nms_threshold: 0.45
    weights: "object_detector.hef"
    training_dataset: "sbp_objects_v3"
    training_samples: 12500
    validation_mAP: 0.72

  # MobileNet для классификации грунта
  sediment_classifier:
    architecture: "mobilenetv3_small"
    input_size: [224, 224]
    output_classes: 5  # mud, sand, clay, gravel, rock
    weights: "sediment_classifier.hef"
    training_dataset: "sediment_textures_v1"
    training_samples: 8000
    validation_accuracy: 0.84

  # Специализированная модель для археологии
  archaeological_classifier:
    architecture: "efficientnet_lite0"
    input_size: [256, 256]
    output_classes: 14
    weights: "archaeological_classifier.hef"
    training_dataset: "archaeological_sbp_v2"
    training_samples: 18500
    validation_accuracy: 0.79
    notes: "Дообучена на реальных археологических находках"

# ============================================================================
# Параметры анализа
# ============================================================================

analysis:
  # Пороги детекции
  detection:
    min_confidence: 0.35
    archaeological_threshold: 0.5
    high_priority_threshold: 0.75

  # Группировка в памятники
  site_clustering:
    max_distance_m: 50
    min_objects: 2

  # Оценка периода по глубине
  period_estimation:
    ancient_depth_m: [2.0, 15.0]
    medieval_depth_m: [1.0, 8.0]
    early_modern_depth_m: [0.5, 5.0]
    modern_depth_m: [0.0, 3.0]

  # Веса для научной ценности
  scientific_value_weights:
    rarity: 0.3
    age: 0.25
    size: 0.15
    preservation: 0.2
    context: 0.1
